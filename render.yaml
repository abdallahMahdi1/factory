services:
  - type: web
    name: factory-tracker-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/server.js
    envVars:
      - key: PORT
        value: 10000
      - key: DATABASE_PATH
        value: ./data.db
      - key: JWT_SECRET
        generateValue: true
      - key: OFFLINE_ALERT_MINUTES
        value: 20
      - key: LONG_SESSION_ALERT_HOURS
        value: 14

  - type: web
    name: factory-tracker-admin
    runtime: static
    rootDir: admin-web
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      # The admin panel is a client-side React app (React Router) — every
      # path needs to fall back to index.html so the app's own router can
      # take over, rather than Render 404ing on any URL that isn't a literal
      # file on disk (e.g. loading /machines or /sessions directly, or
      # refreshing the page while on one of them).
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Set this AFTER the backend service deploys and you know its real
      # URL (Render shows it on the backend service's page) — e.g.
      # https://factory-tracker-backend.onrender.com/api. Render's
      # cross-service URL linking for static sites isn't reliable enough
      # to automate here, so this one env var is set by hand, once.
      - key: VITE_API_BASE
        sync: false
